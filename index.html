<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#26272b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="ao timer">
<title>ao timer</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #171a1f;
    --surface2: #20242b;
    --border: #3a404a;
    --text: #eef1f5;
    --muted: #9aa3ae;
    --green: #22a447;
    --red: #d93a3a;
    --blue: #2f6fe0;
    --warn: #e0a43a;
    --nav-h: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100dvh;
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
    overscroll-behavior-y: none;
  }
  button { font-family: inherit; }

  /* ---------- Views ---------- */
  .view { display: none; padding: calc(14px + var(--safe-t)) 14px 20px; }
  .view.active { display: block; }
  h1 { margin: 0 0 12px; font-size: 1.6rem; font-weight: 700; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  }
  .card label, .card .lbl { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .dirty { margin-left: 8px; color: var(--warn); font-size: .75rem; }
  .wname-display { font-size: 1.1rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  input[type=text], select {
    width: 100%; height: 42px; background: #0b0d10; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 1rem;
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--green); margin: 0; }

  /* ---------- Aktionsleiste / Buttons ---------- */
  .actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn {
    flex: 1; min-height: 46px; background: #000; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: .92rem; font-weight: 600; padding: 6px 6px; line-height: 1.15; cursor: pointer;
  }
  .btn:active { background: #1d2128; }
  .btn.on { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { border-color: var(--red); color: #ff8a8a; }

  /* ---------- Setup-Tabelle ---------- */
  .itable {
    --cols: minmax(0,1fr) minmax(0,1.3fr) 58px 58px;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface);
  }
  .itable.dnd { --cols: 32px minmax(0,1fr) minmax(0,1.3fr) 58px 58px; }
  .irow {
    display: grid; grid-template-columns: var(--cols); align-items: center;
    gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .ihead { font-size: .75rem; color: var(--muted); border-top: 0; background: var(--surface2); }
  .irows .irow:first-child { border-top: 0; }
  .ihead + .irows .irow:first-child { border-top: 1px solid var(--border); }
  .c { display: flex; justify-content: center; text-align: center; }
  .irow.dragging { background: var(--surface2); box-shadow: 0 6px 18px rgba(0,0,0,.6); position: relative; z-index: 2; }
  .handle {
    touch-action: none; display: flex; align-items: center; justify-content: center;
    height: 42px; color: var(--muted); cursor: grab;
  }
  .handle svg { width: 18px; height: 18px; fill: currentColor; }

  select.color {
    appearance: none; -webkit-appearance: none; font-weight: 600; color: #fff;
    border-color: transparent; padding-right: 28px;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
    background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  select.color[data-color=green] { background-color: var(--green); }
  select.color[data-color=red]   { background-color: var(--red); }
  select.color[data-color=blue]  { background-color: var(--blue); }
  select option { background: #111; color: #fff; }

  /* ---------- Timer ---------- */
  #view-timer.active {
    display: flex; flex-direction: column;
    height: calc(100dvh - var(--nav-h) - var(--safe-b));
  }
  .tfield {
    flex: 1; min-height: 0; border-radius: 18px; display: flex;
    align-items: center; justify-content: center; background: var(--surface2);
    transition: background-color .15s;
  }
  .tfield[data-color=green] { background: var(--green); }
  .tfield[data-color=red]   { background: var(--red); }
  .tfield[data-color=blue]  { background: var(--blue); }
  .tfield[data-color=done]  { background: var(--surface2); }
  .tnum {
    font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; line-height: 1;
    font-size: min(48vw, 32vh);
  }
  .tnum.l3 { font-size: min(36vw, 26vh); }
  .tnum.l4 { font-size: min(27vw, 20vh); }
  .tnum.done { font-size: min(20vw, 14vh); }
  .tinfo { text-align: center; color: var(--muted); font-size: .85rem; padding-top: 8px; min-height: 1.4em; }

  /* ---------- List ---------- */
  .wlist { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .wrow {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center;
    gap: 12px; padding: 12px; border-top: 1px solid var(--border); cursor: pointer;
  }
  .wrow:first-child { border-top: 0; }
  .wrow.sel { background: var(--surface2); }
  .wtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .wdate { font-size: .75rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- Sound ---------- */
  .sgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .scell {
    position: relative; min-height: 104px; border-radius: 12px; border: 2px solid;
    padding: 10px 8px; display: flex; flex-direction: column; justify-content: space-between;
    gap: 6px; cursor: pointer; color: var(--text); user-select: none;
  }
  .scell.green { border-color: var(--green); background: rgba(34,164,71,.14); }
  .scell.red   { border-color: var(--red);   background: rgba(217,58,58,.14); }
  .scell.blue  { border-color: var(--blue);  background: rgba(47,111,224,.14); }
  .scell.green.has { background: rgba(34,164,71,.38); }
  .scell.red.has   { background: rgba(217,58,58,.38); }
  .scell.blue.has  { background: rgba(47,111,224,.38); }
  .slabel { font-size: .75rem; color: var(--muted); padding-right: 26px; }
  .scell.has .slabel { color: #dfe4ea; }
  .sfile { font-size: .8rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sempty { font-size: .8rem; color: var(--muted); }
  .sdel {
    position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: #000; color: var(--text); font-size: 1rem;
    line-height: 1; padding: 0; cursor: pointer;
  }
  .hint { color: var(--muted); font-size: .8rem; margin: 14px 2px 0; line-height: 1.4; }

  /* ---------- Bottom Navigation ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
    display: flex; background: #000; border-top: 1px solid var(--border);
  }
  .nav button {
    flex: 1; background: none; border: 0; border-top: 3px solid transparent; color: var(--muted);
    font-size: .78rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer;
  }
  .nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.active { color: var(--green); border-top-color: var(--green); }

  /* ---------- Toast / Modal ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
    transform: translate(-50%, 20px); background: #262b33; color: var(--text);
    border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 120; max-width: calc(100% - 32px); text-align: center; font-size: .95rem;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none;
    align-items: center; justify-content: center; padding: 24px; z-index: 110;
  }
  .modal.show { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: 100%; max-width: 360px; }
  .modal-box p { margin: 0 0 16px; line-height: 1.4; word-break: break-word; }
  .modal-box .actions { margin: 0; }
</style>
</head>
<body>

<main>
  <section class="view" id="view-setup"></section>
  <section class="view" id="view-timer"></section>
  <section class="view" id="view-list"></section>
  <section class="view" id="view-sound"></section>
</main>

<nav class="nav" id="nav">
  <button data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span></span></button>
  <button data-tab="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/></svg><span></span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span></span></button>
  <button data-tab="sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span></span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal"></div>

<script>
'use strict';

/* =====================================================================
   KONFIGURATION & BESCHRIFTUNGEN (Schlüssel englisch, Texte deutsch)
   ===================================================================== */
const COLORS = ['green', 'red', 'blue'];
const SLOTS = ['start', 'middle', 'end'];
const TABS = ['setup', 'timer', 'list', 'sound'];

const CONFIG = {
  minDuration: 1,
  maxDuration: 3599,
  defaultName: 'Mein Workout',
  defaultIntervals: [[10, 'green'], [40, 'red'], [20, 'blue']],
  toastMs: 2000,
  tickMs: 100
};

const LABELS = {
  tabs: { setup: 'Setup', timer: 'Timer', list: 'List', sound: 'Sound' },
  colors: { green: 'Grün', red: 'Rot', blue: 'Blau' },
  slots: { start: 'Beginn', middle: 'Dazwischen', end: 'Ende' },
  setup: {
    nameLabel: 'Name des Workouts', unsaved: '● ungesichert',
    save: 'Workout sichern', apply: 'Kopieren/ Löschen', dnd: 'Drag & Drop',
    colDuration: 'Dauer (s)', colColor: 'Farbe', colCopy: 'Kopieren', colDelete: 'Löschen'
  },
  timer: { workout: 'Workout', start: 'Start', stop: 'Stop', next: 'Vor', prev: 'Zurück', done: 'Fertig', noName: '(ohne Namen)' },
  list: { start: 'Starten', del: 'Löschen', setupNew: 'Setup neu' },
  sound: { none: 'kein Sound', hint: 'Tippe auf ein Feld, um eine Audiodatei zu wählen. Die Sounds gelten für alle Workouts.' },
  common: { cancel: 'Abbrechen', del: 'Löschen', discard: 'Verwerfen', remove: 'Entfernen' },
  msg: {
    keepOne: 'Mindestens ein Intervall muss bleiben.',
    noMarks: 'Bitte zuerst Zeilen markieren.',
    durationInvalid: `Dauer: ganze Zahl von ${CONFIG.minDuration} bis ${CONFIG.maxDuration}.`,
    nameMissing: 'Bitte einen Namen eingeben.',
    saved: 'Workout gesichert.',
    updated: 'Workout aktualisiert.',
    saveFailed: 'Speichern fehlgeschlagen.',
    selectWorkout: 'Bitte ein Workout auswählen.',
    deleted: 'Workout gelöscht.',
    confirmDelete: n => `Workout '${n}' wirklich löschen?`,
    confirmDiscard: 'Ungesicherte Änderungen im Setup verwerfen?',
    confirmRemoveSound: n => `Sound '${n}' entfernen?`,
    soundSaved: 'Sound gespeichert.',
    soundRemoved: 'Sound entfernt.',
    soundFailed: 'Datei konnte nicht gelesen werden.',
    soundStoreFailed: 'Sound konnte nicht gespeichert werden.'
  }
};

/* =====================================================================
   UTILS
   ===================================================================== */
const Utils = {
  uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },
  normName(n) {
    return String(n || '').trim().toLowerCase();
  },
  formatDate(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} | ${p(d.getHours())}:${p(d.getMinutes())}`;
  },
  el(tag, props = {}, children = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v; // nur für feste, eigene Inhalte (Icons)
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'hidden') n[k] = v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of [].concat(children)) {
      if (c === null || c === undefined || c === false) continue;
      n.append(c instanceof Node ? c : String(c));
    }
    return n;
  },
  button(label, onClick, extraClass = '') {
    return Utils.el('button', { class: ('btn ' + extraClass).trim(), type: 'button', text: label, onclick: onClick });
  },
  _toastTimer: null,
  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(Utils._toastTimer);
    Utils._toastTimer = setTimeout(() => t.classList.remove('show'), CONFIG.toastMs);
  },
  confirm(message, okLabel, cancelLabel = LABELS.common.cancel) {
    return new Promise(resolve => {
      const root = document.getElementById('modal');
      const close = v => {
        root.classList.remove('show');
        root.replaceChildren();
        root.onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(v);
      };
      const onKey = e => { if (e.key === 'Escape') close(false); };
      const box = Utils.el('div', { class: 'modal-box', role: 'dialog', 'aria-modal': 'true' }, [
        Utils.el('p', { text: message }),
        Utils.el('div', { class: 'actions' }, [
          Utils.button(cancelLabel, () => close(false)),
          Utils.button(okLabel, () => close(true), 'danger')
        ])
      ]);
      root.replaceChildren(box);
      root.onclick = e => { if (e.target === root) close(false); };
      document.addEventListener('keydown', onKey);
      root.classList.add('show');
    });
  }
};

const WakeLock = {
  sentinel: null,
  wanted: false,
  async request() {
    this.wanted = true;
    if (!('wakeLock' in navigator) || this.sentinel || document.visibilityState !== 'visible') return;
    try {
      this.sentinel = await navigator.wakeLock.request('screen');
      this.sentinel.addEventListener('release', () => { this.sentinel = null; });
    } catch (e) { /* nicht verfügbar – ignorieren */ }
  },
  async release() {
    this.wanted = false;
    try { if (this.sentinel) await this.sentinel.release(); } catch (e) {}
    this.sentinel = null;
  }
};

/* =====================================================================
   STORE (Daten: localStorage für Workouts, IndexedDB für Sounds)
   ===================================================================== */
const IDB = (() => {
  const DB_NAME = 'workout-timer';
  const STORE = 'sounds';
  let dbPromise = null;

  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject(new Error('IndexedDB fehlt')); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      dbPromise.catch(() => { dbPromise = null; });
    }
    return dbPromise;
  }

  async function run(mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, mode);
      const req = fn(tx.objectStore(STORE));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }

  return {
    get: key => run('readonly', s => s.get(key)),
    put: (key, value) => run('readwrite', s => s.put(value, key)),
    del: key => run('readwrite', s => s.delete(key))
  };
})();

const Store = (() => {
  const K_WORKOUTS = 'wt.workouts.v1';
  const K_DRAFT = 'wt.draft.v1';

  let workouts = [];          // gesicherte Workouts
  let setup = null;           // Arbeitskopie im Setup { id|null, name, intervals }
  let baseline = '';          // Schnappschuss des zuletzt gesicherten/geladenen Zustands
  let timerWorkoutId = null;  // Auswahl aus List für den Timer (null = Setup-Workout)
  const soundMeta = {};       // "color.slot" -> { name, duration }

  const isColor = c => COLORS.includes(c);
  const validDuration = d => Number.isInteger(d) && d >= CONFIG.minDuration && d <= CONFIG.maxDuration;

  function sanitizeIntervals(arr) {
    if (!Array.isArray(arr)) return [];
    return arr
      .filter(i => i && validDuration(i.duration) && isColor(i.color))
      .map(i => ({ id: String(i.id || Utils.uid()), duration: i.duration, color: i.color }));
  }
  function sanitizeWorkout(w) {
    if (!w || typeof w.name !== 'string') return null;
    const intervals = sanitizeIntervals(w.intervals);
    if (!intervals.length) return null;
    return { id: String(w.id || Utils.uid()), name: w.name, intervals, savedAt: Number(w.savedAt) || Date.now() };
  }
  function cloneIntervals(arr, newIds) {
    return arr.map(i => ({ id: newIds ? Utils.uid() : i.id, duration: i.duration, color: i.color }));
  }
  function defaultSetup() {
    return {
      id: null,
      name: CONFIG.defaultName,
      intervals: CONFIG.defaultIntervals.map(([d, c]) => ({ id: Utils.uid(), duration: d, color: c }))
    };
  }
  function snap(w) {
    return JSON.stringify([w.name.trim(), w.intervals.map(i => [i.duration, i.color])]);
  }
  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  function persistDraft() { writeJSON(K_DRAFT, { setup, baseline, timerWorkoutId }); }
  function persistWorkouts() { return writeJSON(K_WORKOUTS, workouts); }
  function touchSetup() { timerWorkoutId = null; persistDraft(); }

  function init() {
    const raw = readJSON(K_WORKOUTS);
    workouts = Array.isArray(raw) ? raw.map(sanitizeWorkout).filter(Boolean) : [];

    const d = readJSON(K_DRAFT);
    const s = d && d.setup;
    const ints = s ? sanitizeIntervals(s.intervals) : [];
    if (s && typeof s.name === 'string' && ints.length) {
      setup = { id: s.id || null, name: s.name, intervals: ints };
      baseline = typeof d.baseline === 'string' ? d.baseline : snap(setup);
      timerWorkoutId = d.timerWorkoutId || null;
    } else {
      setup = defaultSetup();
      baseline = snap(setup);
    }
    if (timerWorkoutId && !getWorkout(timerWorkoutId)) timerWorkoutId = null;
  }

  /* --- Workouts --- */
  function getWorkout(id) { return workouts.find(w => w.id === id) || null; }
  function listWorkouts() { return [...workouts].sort((a, b) => b.savedAt - a.savedAt); }

  function deleteWorkout(id) {
    workouts = workouts.filter(w => w.id !== id);
    persistWorkouts();
    if (timerWorkoutId === id) timerWorkoutId = null;
    if (setup.id === id) setup.id = null;
    persistDraft();
  }

  /* --- Setup-Arbeitskopie --- */
  function getSetup() { return setup; }
  function isSetupDirty() { return snap(setup) !== baseline; }
  function setSetupName(name) { setup.name = name; touchSetup(); }
  function updateInterval(id, patch) {
    const it = setup.intervals.find(i => i.id === id);
    if (!it) return;
    Object.assign(it, patch);
    touchSetup();
  }
  function reorderSetup(ids) {
    const map = new Map(setup.intervals.map(i => [i.id, i]));
    const next = ids.map(id => map.get(id)).filter(Boolean);
    if (next.length !== setup.intervals.length) return;
    const changed = next.some((it, idx) => it !== setup.intervals[idx]);
    if (!changed) return;
    setup.intervals = next;
    touchSetup();
  }
  /** marks: Map(intervalId -> 'copy' | 'delete'). Erst kopieren, dann löschen. */
  function applyMarks(marks) {
    const copies = setup.intervals
      .filter(i => marks.get(i.id) === 'copy')
      .map(i => ({ id: Utils.uid(), duration: i.duration, color: i.color }));
    const all = [...setup.intervals, ...copies];
    const delIds = new Set([...marks].filter(([, v]) => v === 'delete').map(([k]) => k));
    let kept = all.filter(i => !delIds.has(i.id));
    let keptOne = false;
    if (!kept.length) {
      kept = [setup.intervals.find(i => delIds.has(i.id))];
      keptOne = true;
    }
    setup.intervals = kept;
    touchSetup();
    return { keptOne };
  }
  function saveSetup() {
    const name = setup.name.trim();
    if (!name) return { ok: false, msg: LABELS.msg.nameMissing };
    const key = Utils.normName(name);
    const backup = JSON.stringify(workouts);
    const existing = workouts.find(w => Utils.normName(w.name) === key);
    const data = { name, intervals: cloneIntervals(setup.intervals, false), savedAt: Date.now() };
    let saved;
    if (existing) { Object.assign(existing, data); saved = existing; }
    else { saved = { id: Utils.uid(), ...data }; workouts.push(saved); }
    if (!persistWorkouts()) {
      workouts = JSON.parse(backup);
      return { ok: false, msg: LABELS.msg.saveFailed };
    }
    setup.id = saved.id;
    setup.name = name;
    baseline = snap(setup);
    persistDraft();
    return { ok: true, msg: existing ? LABELS.msg.updated : LABELS.msg.saved };
  }
  function loadIntoSetup(id) {
    const w = getWorkout(id);
    if (!w) return false;
    setup = { id: w.id, name: w.name, intervals: cloneIntervals(w.intervals, true) };
    baseline = snap(setup);
    timerWorkoutId = null;
    persistDraft();
    return true;
  }

  /* --- Timer-Auswahl --- */
  function selectForTimer(id) { timerWorkoutId = id; persistDraft(); }
  function getTimerWorkout() {
    const w = timerWorkoutId && getWorkout(timerWorkoutId);
    return w ? { source: 'list', workout: w } : { source: 'setup', workout: setup };
  }

  /* --- Sounds --- */
  const soundKey = (color, slot) => `${color}.${slot}`;
  async function loadSounds() {
    const out = [];
    for (const c of COLORS) for (const s of SLOTS) {
      const key = soundKey(c, s);
      try {
        const v = await IDB.get(key);
        if (v && v.data) {
          soundMeta[key] = { name: v.name, duration: v.duration };
          out.push({ key, data: v.data });
        }
      } catch (e) { /* IndexedDB nicht verfügbar */ }
    }
    return out;
  }
  async function setSound(color, slot, { name, data, duration }) {
    const key = soundKey(color, slot);
    await IDB.put(key, { name, data, duration });
    soundMeta[key] = { name, duration };
  }
  async function removeSound(color, slot) {
    const key = soundKey(color, slot);
    await IDB.del(key);
    delete soundMeta[key];
  }
  function getSoundMeta(color, slot) { return soundMeta[soundKey(color, slot)] || null; }

  return {
    init, getWorkout, listWorkouts, deleteWorkout,
    getSetup, isSetupDirty, setSetupName, updateInterval, reorderSetup, applyMarks, saveSetup, loadIntoSetup,
    selectForTimer, getTimerWorkout,
    soundKey, loadSounds, setSound, removeSound, getSoundMeta
  };
})();

/* =====================================================================
   AUDIO ENGINE (Web Audio API)
   ===================================================================== */
const AudioEngine = (() => {
  let ctx = null;
  const buffers = {};   // "color.slot" -> AudioBuffer
  let active = [];      // laufende AudioBufferSourceNodes

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('Web Audio nicht verfügbar');
      ctx = new AC();
    }
    return ctx;
  }
  async function unlock() {
    try {
      ensureCtx();
      if (ctx.state !== 'running') await ctx.resume();
    } catch (e) {}
  }
  async function decode(blob) {
    const ab = await blob.arrayBuffer();
    return await ensureCtx().decodeAudioData(ab);
  }
  function setBuffer(key, buffer) {
    if (buffer) buffers[key] = buffer; else delete buffers[key];
  }
  function stopAll() {
    for (const src of active) {
      src.onended = null;
      try { src.stop(); } catch (e) {}
      try { src.disconnect(); } catch (e) {}
    }
    active = [];
  }
  /** Zeitabschnitte (Sekunden relativ zum Intervallbeginn) für eine Farbe. */
  function segments(color, D) {
    const S = buffers[`${color}.start`];
    const M = buffers[`${color}.middle`];
    const E = buffers[`${color}.end`];
    const segs = [];
    const startEnd = S ? Math.min(S.duration, D) : 0;
    if (S) segs.push({ buf: S, a: 0, b: startEnd, loop: false });
    let endStart = D;
    if (E) {
      endStart = Math.max(0, D - E.duration);       // länger als Intervall: startet bei 0, wird bei D abgeschnitten
      segs.push({ buf: E, a: endStart, b: D, loop: false });
    }
    if (M && endStart > startEnd) segs.push({ buf: M, a: startEnd, b: endStart, loop: true });
    return segs;
  }
  /** Spielt die Sounds eines Intervalls, als wären bereits `elapsed` Sekunden vergangen. */
  function playInterval(color, duration, elapsed) {
    stopAll();
    if (!ctx) return;
    if (ctx.state !== 'running') { ctx.resume().catch(() => {}); if (ctx.state !== 'running') return; }
    const now = ctx.currentTime + 0.02;
    for (const sg of segments(color, duration)) {
      if (elapsed >= sg.b || sg.b <= sg.a) continue;
      const src = ctx.createBufferSource();
      src.buffer = sg.buf;
      src.loop = sg.loop;
      src.connect(ctx.destination);
      const delay = Math.max(0, sg.a - elapsed);
      let offset = Math.max(0, elapsed - sg.a);
      if (sg.loop) offset = offset % sg.buf.duration;
      src.start(now + delay, offset);
      src.stop(now + (sg.b - elapsed));
      src.onended = () => {
        active = active.filter(x => x !== src);
        try { src.disconnect(); } catch (e) {}
      };
      active.push(src);
    }
  }
  return { unlock, decode, setBuffer, stopAll, playInterval };
})();

/* =====================================================================
   TIMER ENGINE (Systemzeit über performance.now)
   ===================================================================== */
const TimerEngine = (() => {
  let intervals = [];
  let index = 0;
  let remainingMs = 0;
  let running = false;
  let finished = false;
  let endAt = 0;
  let loopId = null;
  let signature = null;
  let listener = () => {};

  const now = () => performance.now();
  const durMs = i => intervals[i].duration * 1000;
  const emit = (type, payload) => listener(type, payload);

  function playPayload() {
    const it = intervals[index];
    return { color: it.color, duration: it.duration, elapsed: Math.max(0, (durMs(index) - remainingMs) / 1000) };
  }
  function startLoop() { stopLoop(); loopId = setInterval(tick, CONFIG.tickMs); }
  function stopLoop() { if (loopId) clearInterval(loopId); loopId = null; }
  function setRunning(v) { if (running === v) return; running = v; emit('running', v); }

  function load(list, sig) {
    stopLoop();
    setRunning(false);
    intervals = list.map(i => ({ duration: i.duration, color: i.color }));
    index = 0;
    finished = false;
    remainingMs = intervals.length ? durMs(0) : 0;
    signature = sig;
    emit('halt');
    emit('change');
  }
  function start() {
    if (!intervals.length || running) return;
    if (finished) { finished = false; index = 0; remainingMs = durMs(0); }
    endAt = now() + remainingMs;
    setRunning(true);
    startLoop();
    emit('play', playPayload());
    emit('change');
  }
  function stop() {
    if (!running) return;
    remainingMs = Math.max(0, endAt - now());
    stopLoop();
    setRunning(false);
    emit('halt');
    emit('change');
  }
  function finish() {
    stopLoop();
    finished = true;
    remainingMs = 0;
    setRunning(false);
    emit('halt');
    emit('change');
  }
  function tick() {
    if (!running) return;
    const t = now();
    let advanced = false;
    while (t >= endAt) {
      if (index >= intervals.length - 1) { finish(); return; }
      index++;
      endAt += durMs(index);
      advanced = true;
    }
    remainingMs = endAt - t;
    if (advanced) emit('play', playPayload());
    emit('change');
  }
  function jump(delta) {
    if (!intervals.length) return;
    if (finished) {
      if (delta > 0) return;
      finished = false;
      index = intervals.length - 1;
    } else {
      const ni = index + delta;
      if (ni >= intervals.length) { finish(); return; }
      index = Math.max(0, ni);
    }
    remainingMs = durMs(index);
    if (running) {
      endAt = now() + remainingMs;
      emit('play', playPayload());
    } else {
      emit('halt');
    }
    emit('change');
  }
  function getState() {
    return {
      total: intervals.length,
      index,
      remainingSec: Math.ceil(remainingMs / 1000),
      running,
      finished,
      color: intervals[index] ? intervals[index].color : null
    };
  }
  return {
    setListener: fn => { listener = fn; },
    load, start, stop,
    next: () => jump(1),
    prev: () => jump(-1),
    sync: tick,
    getState,
    getSignature: () => signature,
    invalidate: () => { signature = null; }
  };
})();

const GRIP_SVG = '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';

/* ---------- Setup ---------- */
const SetupView = (() => {
  const L = LABELS.setup;
  const ui = { marks: new Map(), dnd: false };
  let nameInput, dirtyEl, tableEl, rowsEl, dndBtn;

  function build() {
    const root = document.getElementById('view-setup');
    nameInput = Utils.el('input', {
      type: 'text', id: 'setup-name', maxlength: '60', autocomplete: 'off', enterkeyhint: 'done',
      oninput: () => { Store.setSetupName(nameInput.value); updateDirty(); },
      onkeydown: e => { if (e.key === 'Enter') nameInput.blur(); }
    });
    dirtyEl = Utils.el('span', { class: 'dirty', text: L.unsaved, hidden: true });
    dndBtn = Utils.button(L.dnd, toggleDnd);
    tableEl = Utils.el('div', { class: 'itable' });
    root.append(
      Utils.el('h1', { text: LABELS.tabs.setup }),
      Utils.el('div', { class: 'card' }, [
        Utils.el('label', { for: 'setup-name' }, [L.nameLabel, dirtyEl]),
        nameInput
      ]),
      Utils.el('div', { class: 'actions' }, [
        Utils.button(L.save, onSave),
        Utils.button(L.apply, onApply),
        dndBtn
      ]),
      tableEl
    );
  }

  function show() {
    if (document.activeElement !== nameInput) nameInput.value = Store.getSetup().name;
    renderRows();
    updateDirty();
  }

  function resetUi() { ui.marks.clear(); }

  function updateDirty() { dirtyEl.hidden = !Store.isSetupDirty(); }

  function renderRows() {
    const s = Store.getSetup();
    const ids = new Set(s.intervals.map(i => i.id));
    for (const id of [...ui.marks.keys()]) if (!ids.has(id)) ui.marks.delete(id);

    tableEl.classList.toggle('dnd', ui.dnd);
    const head = Utils.el('div', { class: 'irow ihead' }, [
      ui.dnd ? Utils.el('span') : null,
      Utils.el('span', { text: L.colDuration }),
      Utils.el('span', { text: L.colColor }),
      Utils.el('span', { class: 'c', text: L.colCopy }),
      Utils.el('span', { class: 'c', text: L.colDelete })
    ]);
    rowsEl = Utils.el('div', { class: 'irows' }, s.intervals.map(rowFor));
    tableEl.replaceChildren(head, rowsEl);
  }

  function rowFor(it) {
    const mark = ui.marks.get(it.id);
    const dur = Utils.el('input', {
      type: 'text', inputmode: 'numeric', class: 'dur', value: String(it.duration), 'aria-label': L.colDuration,
      onchange: e => onDuration(it, e.target),
      onkeydown: e => { if (e.key === 'Enter') e.target.blur(); }
    });
    const sel = Utils.el('select', {
      class: 'color', 'data-color': it.color, 'aria-label': L.colColor,
      onchange: e => {
        Store.updateInterval(it.id, { color: e.target.value });
        e.target.dataset.color = e.target.value;
        updateDirty();
      }
    }, COLORS.map(c => Utils.el('option', { value: c, text: LABELS.colors[c] })));
    sel.value = it.color;

    const cbCopy = Utils.el('input', { type: 'checkbox', checked: mark === 'copy', 'aria-label': L.colCopy });
    const cbDel = Utils.el('input', { type: 'checkbox', checked: mark === 'delete', 'aria-label': L.colDelete });
    cbCopy.addEventListener('change', () => onMark(it.id, 'copy', cbCopy, cbDel));
    cbDel.addEventListener('change', () => onMark(it.id, 'delete', cbDel, cbCopy));

    const row = Utils.el('div', { class: 'irow', 'data-id': it.id });
    const handle = ui.dnd
      ? Utils.el('div', { class: 'handle', html: GRIP_SVG, 'aria-label': 'Ziehen', onpointerdown: e => startDrag(e, row) })
      : null;
    row.append(...[handle, dur, sel, Utils.el('div', { class: 'c' }, cbCopy), Utils.el('div', { class: 'c' }, cbDel)].filter(Boolean));
    return row;
  }

  function onDuration(it, input) {
    const raw = input.value.trim();
    const n = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
    if (!Number.isInteger(n) || n < CONFIG.minDuration || n > CONFIG.maxDuration) {
      input.value = String(it.duration);
      Utils.toast(LABELS.msg.durationInvalid);
      return;
    }
    input.value = String(n);
    Store.updateInterval(it.id, { duration: n });
    updateDirty();
  }

  function onMark(id, type, cb, other) {
    if (cb.checked) {
      ui.marks.set(id, type);
      other.checked = false;
    } else if (ui.marks.get(id) === type) {
      ui.marks.delete(id);
    }
  }

  function onApply() {
    if (!ui.marks.size) { Utils.toast(LABELS.msg.noMarks); return; }
    const r = Store.applyMarks(ui.marks);
    ui.marks.clear();
    renderRows();
    updateDirty();
    if (r.keptOne) Utils.toast(LABELS.msg.keepOne);
  }

  function onSave() {
    // Offene Eingabe in einem Dauerfeld zuerst übernehmen
    if (document.activeElement && document.activeElement.classList.contains('dur')) document.activeElement.blur();
    const r = Store.saveSetup();
    Utils.toast(r.msg);
    if (r.ok) nameInput.value = Store.getSetup().name;
    updateDirty();
  }

  function toggleDnd() {
    ui.dnd = !ui.dnd;
    dndBtn.classList.toggle('on', ui.dnd);
    renderRows();
  }

  function startDrag(e, row) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const handle = e.currentTarget;
    const list = rowsEl;
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    row.classList.add('dragging');
    const navH = document.getElementById('nav').offsetHeight;
    let lastY = e.clientY;
    let active = true;
    let raf = 0;

    const place = () => {
      const others = [...list.children].filter(r => r !== row);
      let before = null;
      for (const r of others) {
        const rc = r.getBoundingClientRect();
        if (lastY < rc.top + rc.height / 2) { before = r; break; }
      }
      if (before) { if (row.nextElementSibling !== before) list.insertBefore(row, before); }
      else if (list.lastElementChild !== row) list.append(row);
    };
    const autoScroll = () => {
      if (!active) return;
      const edge = 70;
      let dy = 0;
      if (lastY < edge) dy = -8;
      else if (lastY > window.innerHeight - navH - edge) dy = 8;
      if (dy) { window.scrollBy(0, dy); place(); }
      raf = requestAnimationFrame(autoScroll);
    };
    const move = ev => { lastY = ev.clientY; place(); };
    const end = () => {
      active = false;
      cancelAnimationFrame(raf);
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', end);
      handle.removeEventListener('pointercancel', end);
      row.classList.remove('dragging');
      Store.reorderSetup([...list.children].map(r => r.dataset.id));
      updateDirty();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    raf = requestAnimationFrame(autoScroll);
  }

  return { build, show, resetUi };
})();

/* ---------- Timer ---------- */
const TimerView = (() => {
  const L = LABELS.timer;
  let nameEl, field, numEl, infoEl, startBtn;

  function build() {
    const root = document.getElementById('view-timer');
    nameEl = Utils.el('div', { class: 'wname-display' });
    numEl = Utils.el('div', { class: 'tnum' });
    field = Utils.el('div', { class: 'tfield' }, numEl);
    infoEl = Utils.el('div', { class: 'tinfo' });
    startBtn = Utils.button(L.start, onStart);
    root.append(
      Utils.el('h1', { text: LABELS.tabs.timer }),
      Utils.el('div', { class: 'card' }, [Utils.el('span', { class: 'lbl', text: L.workout }), nameEl]),
      Utils.el('div', { class: 'actions' }, [
        startBtn,
        Utils.button(L.stop, () => TimerEngine.stop()),
        Utils.button(L.next, () => TimerEngine.next()),
        Utils.button(L.prev, () => TimerEngine.prev())
      ]),
      field,
      infoEl
    );
  }

  async function onStart() {
    await AudioEngine.unlock();   // Audio-Freischaltung durch Berührung
    TimerEngine.start();
  }

  function syncSource() {
    const { source, workout } = Store.getTimerWorkout();
    const sig = JSON.stringify([source, source === 'list' ? workout.id : '', workout.intervals.map(i => [i.duration, i.color])]);
    if (sig !== TimerEngine.getSignature()) TimerEngine.load(workout.intervals, sig);
    nameEl.textContent = workout.name.trim() || L.noName;
  }

  function show() {
    syncSource();
    render();
  }

  function render() {
    const st = TimerEngine.getState();
    const text = st.finished ? L.done : String(st.remainingSec);
    if (numEl.textContent !== text) {
      numEl.textContent = text;
      numEl.className = 'tnum' + (st.finished ? ' done' : text.length >= 4 ? ' l4' : text.length === 3 ? ' l3' : '');
    }
    const color = st.finished ? 'done' : (st.color || 'done');
    if (field.dataset.color !== color) field.dataset.color = color;
    infoEl.textContent = st.total
      ? (st.finished ? `${st.total} / ${st.total}` : `Intervall ${st.index + 1} / ${st.total}`)
      : '';
    startBtn.classList.toggle('on', st.running);
  }

  return { build, show, render };
})();

/* ---------- Sound ---------- */
const SoundView = (() => {
  let gridEl, fileInput;
  let pending = null;

  function build() {
    const root = document.getElementById('view-sound');
    gridEl = Utils.el('div', { class: 'sgrid' });
    fileInput = Utils.el('input', { type: 'file', accept: 'audio/*', hidden: true, onchange: onFile });
    root.append(
      Utils.el('h1', { text: LABELS.tabs.sound }),
      gridEl,
      Utils.el('p', { class: 'hint', text: LABELS.sound.hint }),
      fileInput
    );
  }

  function show() { render(); }

  function render() {
    const cells = [];
    for (const c of COLORS) for (const s of SLOTS) cells.push(cellFor(c, s));
    gridEl.replaceChildren(...cells);
  }

  function cellFor(color, slot) {
    const meta = Store.getSoundMeta(color, slot);
    const cell = Utils.el('div', {
      class: `scell ${color}${meta ? ' has' : ''}`, role: 'button', tabindex: '0',
      'aria-label': `${LABELS.colors[color]} – ${LABELS.slots[slot]}`,
      onclick: () => pick(color, slot),
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(color, slot); } }
    }, [
      Utils.el('span', { class: 'slabel', text: LABELS.slots[slot] }),
      meta
        ? Utils.el('span', { class: 'sfile', text: meta.name, title: meta.name })
        : Utils.el('span', { class: 'sempty', text: LABELS.sound.none })
    ]);
    if (meta) {
      cell.append(Utils.el('button', {
        class: 'sdel', type: 'button', text: '×', 'aria-label': LABELS.common.remove,
        onclick: e => { e.stopPropagation(); remove(color, slot, meta.name); }
      }));
    }
    return cell;
  }

  function pick(color, slot) {
    pending = { color, slot };
    fileInput.value = '';
    fileInput.click();
  }

  async function onFile() {
    const file = fileInput.files && fileInput.files[0];
    const target = pending;
    pending = null;
    if (!file || !target) return;
    let buffer;
    try {
      buffer = await AudioEngine.decode(file);
    } catch (e) {
      Utils.toast(LABELS.msg.soundFailed);
      return;
    }
    try {
      const blob = new Blob([file], { type: file.type || 'audio/mpeg' });
      await Store.setSound(target.color, target.slot, { name: file.name, data: blob, duration: buffer.duration });
      AudioEngine.setBuffer(Store.soundKey(target.color, target.slot), buffer);
      Utils.toast(LABELS.msg.soundSaved);
    } catch (e) {
      Utils.toast(LABELS.msg.soundStoreFailed);
    }
    render();
  }

  async function remove(color, slot, name) {
    const ok = await Utils.confirm(LABELS.msg.confirmRemoveSound(name), LABELS.common.remove);
    if (!ok) return;
    try { await Store.removeSound(color, slot); } catch (e) {}
    AudioEngine.setBuffer(Store.soundKey(color, slot), null);
    render();
    Utils.toast(LABELS.msg.soundRemoved);
  }

  return { build, show, render };
})();

/* =====================================================================
   APP / ROUTER
   ===================================================================== */
const Router = {
  current: null,
  views: { setup: SetupView, timer: TimerView, list: ListView, sound: SoundView },
  show(name) {
    if (!this.views[name]) return;
    for (const key of TABS) {
      document.getElementById('view-' + key).classList.toggle('active', key === name);
    }
    for (const btn of document.querySelectorAll('#nav button')) {
      const on = btn.dataset.tab === name;
      btn.classList.toggle('active', on);
      if (on) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
    }
    this.current = name;
    this.views[name].show();
    window.scrollTo(0, 0);
  }
};

const App = {
  async init() {
    Store.init();

    for (const v of Object.values(Router.views)) v.build();

    for (const btn of document.querySelectorAll('#nav button')) {
      btn.querySelector('span').textContent = LABELS.tabs[btn.dataset.tab];
      btn.addEventListener('click', () => Router.show(btn.dataset.tab));
    }

    TimerEngine.setListener((type, payload) => {
      if (type === 'play') AudioEngine.playInterval(payload.color, payload.duration, payload.elapsed);
      else if (type === 'halt') AudioEngine.stopAll();
      else if (type === 'running') { if (payload) WakeLock.request(); else WakeLock.release(); }
      if (Router.current === 'timer') TimerView.render();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        TimerEngine.sync();
        if (WakeLock.wanted) WakeLock.request();
      }
    });

    Router.show('setup');

    // Service Worker (Offline-Fähigkeit, Installation)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Persistenten Speicher anfordern
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted()
        .then(p => p || navigator.storage.persist())
        .catch(() => {});
    }

    // Gespeicherte Sounds laden und dekodieren
    const entries = await Store.loadSounds();
    for (const { key, data } of entries) {
      try { AudioEngine.setBuffer(key, await AudioEngine.decode(data)); } catch (e) {}
    }
    if (Router.current === 'sound') SoundView.render();
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
